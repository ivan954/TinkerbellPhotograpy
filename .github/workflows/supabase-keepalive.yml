# Free Supabase projects pause after a week without activity. This reads the
# site content once a day so the project stays awake even in quiet weeks.
# Needs repository variables (Settings -> Secrets and variables -> Actions ->
# Variables): SUPABASE_URL and SUPABASE_ANON_KEY, the same values as in .env.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read site content
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            "${{ vars.SUPABASE_URL }}/rest/v1/site_content?select=key&limit=1"
